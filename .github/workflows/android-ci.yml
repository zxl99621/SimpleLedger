name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install host SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # 只让真正的 error 使 CI 失败；warning/info 不作为门禁。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Test
        run: flutter test --no-pub
