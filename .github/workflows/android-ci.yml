name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install host SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # 只让真正的 error 使 CI 失败；warning/info 不作为门禁。
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter --version
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.log
          code=$?
          if [ $code -ne 0 ]; then
            if grep -q 'error - ' analyze.log; then
              grep 'error - ' analyze.log | head -20 | while IFS= read -r line; do
                echo "::error::$line"
              done
            else
              tail -30 analyze.log | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
            exit $code
          fi

      - name: Upload analyze log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log

      - name: Test
        run: flutter test --no-pub
