name: beecount
description: "极简记账 - 本地优先的个人记账工具"
publish_to: 'none'
version: 1.1.4+7

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  collection: ^1.18.0
  drift: ^2.20.2
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.3
  decimal: ^3.0.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  csv: ^5.0.2
  file_picker: ^8.1.2
  crypto: ^3.0.5
  pointycastle: ^4.0.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  share_plus: ^12.0.1
  reorderable_grid_view: ^2.2.8
  excel: ^4.0.6
  # 注:pub.dev 最新为 0.9.3,但其 environment.sdk 要求 Dart >=3.10.0 / Flutter
  # >=3.38.1,超出本项目当前锁定的 Flutter 3.27.3 / Dart 3.6.1(会导致
  # pub get 直接解析失败)。0.9.3 相对 0.9.2+1 唯一变化是 iOS UIScene
  # Lifecycle 支持,与本阶段(P0/P1 纯 Dart)无关,故锁定为兼容当前工具链的
  # 最新版 0.9.2+1。
  home_widget: ^0.9.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image_cropper: ^10.0.0
  gbk_codec: ^0.4.0
  app_links: ^6.4.1
  yaml: ^3.1.2
  archive: ^3.6.1
  # 本地 GGUF 推理（Android 专属插件，底层 llama.cpp）
  llama_flutter_android: ^0.2.6
  # API Key 加密存储（Android Keystore / EncryptedSharedPreferences）
  flutter_secure_storage: ^10.3.4
  quick_actions: ^1.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.10
  drift_dev: ^2.20.2
  flutter_launcher_icons: ^0.14.4
  # Testing framework enhancements
  mocktail: ^1.0.4

dependency_overrides:
  # Fix record_linux compatibility issue (we target iOS/Android only)
  record_platform_interface: 1.2.0
  # Pin to 7.1.0 because 7.2.0 requires Flutter >= 3.27.6 (Color.toARGB32)
  image_cropper_platform_interface: 7.1.0

# adaptive_* 三个素材由 scripts/gen_adaptive_icons.py 生成(几何取自 assets/logo.svg);
# monochrome 是 Android 13+ themed icon(Pixel 动态图标)的单色镂空层,见 issue #186。
flutter_launcher_icons:
  android: true
  ios: false  # iOS 图标手工维护,0.14.x 会重写 Contents.json 格式,不要让它碰
  # ⚠️ legacy mipmap ic_launcher.png 已钉死为线上版本(担心影响存量用户),
  # 重跑本工具后务必恢复:git checkout main -- android/app/src/main/res/mipmap-*/ic_launcher.png
  image_path: assets/icon/launcher_legacy.png  # 不透明白底!透明 legacy 图标在部分设备表现差
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg
    - assets/bee.svg
    - assets/logo2.png
    - assets/icons/
    - assets/icons/social/
    - assets/images/
    - assets/header_skins/
  # 字体已移动到可选依赖，使用系统字体以减少应用体积
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
  #       - asset: assets/fonts/NotoSansSC-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansSC-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansSC-Bold.ttf
  #         weight: 700

# 国内网络下 sqlite3 的 native assets 默认从 GitHub Releases 下载预编译库，
# 网络不可达时构建会失败。这里改用可访问的镜像；$RELEASE_TAG / $FILENAME
# 由 Dart build hook 替换。
hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
